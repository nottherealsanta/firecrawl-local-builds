name: build firecrawl-local

# Tag pushes publish a release. Manual runs build every platform and upload workflow artifacts, but never publish.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firecrawl-local-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  TZ: UTC
  LC_ALL: C

jobs:
  validate:
    name: validate the pinned source
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check VERSION and the tag
        id: version
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "VERSION must be x.y.z, got: $version" >&2
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match VERSION $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Verify the crate and prepare the source assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          pin="pins/$VERSION.env"
          test -f "$pin" || { echo "missing pin: $pin" >&2; exit 1; }
          set -a
          . "$pin"
          set +a
          test "$FIRECRAWL_VERSION" = "$VERSION"
          UA="firecrawl-local-builds (https://github.com/$GITHUB_REPOSITORY)"

          if ! meta=$(curl -fsSL --retry 3 --proto '=https' --tlsv1.2 -A "$UA" \
            "https://crates.io/api/v1/crates/firecrawl-local/$VERSION"); then
            echo "could not read crates.io metadata for firecrawl-local $VERSION" >&2
            exit 1
          fi
          checksum=$(printf '%s' "$meta" | jq -r '.version.checksum')
          license=$(printf '%s' "$meta" | jq -r '.version.license')
          yanked=$(printf '%s' "$meta" | jq -r '.version.yanked')
          if [ "${#checksum}" -ne 64 ] || printf '%s' "$checksum" | grep -q '[^0-9a-f]'; then
            echo "crates.io returned an invalid checksum: $checksum" >&2
            exit 1
          fi
          test "$checksum" = "$CRATE_SHA256" || {
            echo "crates.io checksum $checksum does not match pin $CRATE_SHA256" >&2
            exit 1
          }
          test "$license" = "AGPL-3.0" || {
            echo "crates.io reports licence $license, expected AGPL-3.0" >&2
            exit 1
          }
          test "$yanked" = "false" || {
            echo "crates.io reports firecrawl-local $VERSION as yanked" >&2
            exit 1
          }

          mkdir -p "$RUNNER_TEMP/source" "$RUNNER_TEMP/release"
          crate="$RUNNER_TEMP/source/firecrawl-local-$VERSION.crate"
          curl -fsSL --retry 3 --proto '=https' --tlsv1.2 -A "$UA" \
            "https://static.crates.io/crates/firecrawl-local/firecrawl-local-$VERSION.crate" \
            -o "$crate"
          printf '%s  %s\n' "$CRATE_SHA256" "$crate" | sha256sum -c -
          tar -xzf "$crate" -C "$RUNNER_TEMP/source"
          python3 scripts/check-source.py "$RUNNER_TEMP/source/firecrawl-local-$VERSION" \
            "$VERSION" "$CRATE_VCS_COMMIT"

          curl -fsSL --retry 3 --proto '=https' --tlsv1.2 \
            "https://raw.githubusercontent.com/firecrawl/firecrawl/$CRATE_VCS_COMMIT/LICENSE" \
            -o "$RUNNER_TEMP/release/LICENSE"
          printf '%s  %s\n' "$UPSTREAM_LICENSE_SHA256" "$RUNNER_TEMP/release/LICENSE" \
            | sha256sum -c -

          cp "$crate" "$RUNNER_TEMP/release/"
          cp NOTICE.md "$RUNNER_TEMP/release/NOTICE.md"
          {
            echo "# Source for firecrawl-local $VERSION"
            echo
            echo "Exact source: firecrawl-local-$VERSION.crate (attached), SHA-256 $CRATE_SHA256."
            echo
            echo "Upstream repository: https://github.com/firecrawl/firecrawl"
            echo "Upstream commit: $CRATE_VCS_COMMIT (apps/local)"
            echo "Crate page: https://crates.io/crates/firecrawl-local/$VERSION"
            echo "Licence: AGPL-3.0 (LICENSE attached)"
            echo
            echo "The binaries in this release were built from the attached archive without modifying its source."
            echo "Build recipe: https://github.com/$GITHUB_REPOSITORY"
          } > "$RUNNER_TEMP/release/SOURCE.md"

          ls -l "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          retention-days: 7

  build:
    name: ${{ matrix.os }}-${{ matrix.arch }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            os: linux
            arch: amd64
            reproducible: true
          - runner: ubuntu-22.04-arm
            os: linux
            arch: arm64
          - runner: macos-15
            os: darwin
            arch: arm64
          - runner: macos-15-intel
            os: darwin
            arch: amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          set -a
          . "pins/$VERSION.env"
          set +a
          command -v rustup >/dev/null 2>&1 || {
            echo "rustup is not installed on $RUNNER_OS/$RUNNER_ARCH" >&2
            exit 1
          }
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
          rustup default "$RUST_VERSION"
          test "$(rustc --version | awk '{print $2}')" = "$RUST_VERSION"
          rustc --version
      - name: Build from the pinned crate
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          FC_CARGO_HOME: ${{ runner.temp }}/cargo-home
        run: |
          set -euo pipefail
          scripts/build-local.sh
          mkdir -p "$RUNNER_TEMP/out"
          install -m 755 "dist/firecrawl-local-${{ matrix.os }}-${{ matrix.arch }}" "$RUNNER_TEMP/out/"
      - name: Rebuild from scratch and require a byte-identical binary
        if: matrix.reproducible
        env:
          FC_CARGO_HOME: ${{ runner.temp }}/cargo-home
        run: |
          set -euo pipefail
          scripts/build-local.sh
          cmp "$RUNNER_TEMP/out/firecrawl-local-linux-amd64" \
            "dist/firecrawl-local-linux-amd64"
          echo "rebuild is byte-identical"
      - name: Attest the binary
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/out/firecrawl-local-${{ matrix.os }}-${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: asset-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error
          retention-days: 7
      - name: Record the result
        run: |
          set -euo pipefail
          asset="$RUNNER_TEMP/out/firecrawl-local-${{ matrix.os }}-${{ matrix.arch }}"
          if command -v sha256sum >/dev/null 2>&1; then
            hash=$(sha256sum "$asset")
          else
            hash=$(shasum -a 256 "$asset")
          fi
          echo "| ${{ matrix.os }}-${{ matrix.arch }} | $hash |" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: publish v${{ needs.validate.outputs.version }}
    needs: [validate, build]
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: asset-*
          path: ${{ runner.temp }}/dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source
          path: ${{ runner.temp }}/dist
      - name: Check the asset set and file types
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/dist"
          expected=$(printf '%s\n' \
            firecrawl-local-darwin-amd64 \
            firecrawl-local-darwin-arm64 \
            firecrawl-local-linux-amd64 \
            firecrawl-local-linux-arm64 \
            "firecrawl-local-$VERSION.crate" \
            LICENSE NOTICE.md SOURCE.md | LC_ALL=C sort)
          actual=$(find . -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          if [ "$actual" != "$expected" ]; then
            printf 'unexpected asset set\nexpected:\n%s\nactual:\n%s\n' "$expected" "$actual" >&2
            exit 1
          fi
          case "$(file -b firecrawl-local-linux-amd64)" in
            *ELF*64-bit*x86-64*) ;;
            *) echo "linux-amd64 is not an x86-64 ELF" >&2; exit 1 ;;
          esac
          case "$(file -b firecrawl-local-linux-arm64)" in
            *ELF*64-bit*aarch64*) ;;
            *) echo "linux-arm64 is not an arm64 ELF" >&2; exit 1 ;;
          esac
          case "$(file -b firecrawl-local-darwin-amd64)" in
            *Mach-O*64-bit*x86_64*) ;;
            *) echo "darwin-amd64 is not an x86_64 Mach-O" >&2; exit 1 ;;
          esac
          case "$(file -b firecrawl-local-darwin-arm64)" in
            *Mach-O*64-bit*arm64*) ;;
            *) echo "darwin-arm64 is not an arm64 Mach-O" >&2; exit 1 ;;
          esac
          ls -lh
      - name: Write and verify SHA256SUMS
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/dist"
          printf '%s\n' \
            firecrawl-local-darwin-amd64 \
            firecrawl-local-darwin-arm64 \
            firecrawl-local-linux-amd64 \
            firecrawl-local-linux-arm64 \
            "firecrawl-local-$VERSION.crate" \
            LICENSE NOTICE.md SOURCE.md \
            | LC_ALL=C sort \
            | while IFS= read -r name; do sha256sum "$name"; done > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Attest every checksummed file
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/dist/SHA256SUMS
      - name: Write the release notes
        run: |
          set -euo pipefail
          set -a
          . "pins/$VERSION.env"
          set +a
          notes="$RUNNER_TEMP/notes.md"
          cat > "$notes" <<EOF
          Firecrawl Local $VERSION, built unmodified from the crates.io archive.

          Source: https://crates.io/crates/firecrawl-local/$VERSION
          Archive SHA-256: $CRATE_SHA256
          Upstream commit: $CRATE_VCS_COMMIT (apps/local)
          Licence: AGPL-3.0

          ## Assets

          - firecrawl-local-darwin-arm64 (macOS 13+, Apple silicon)
          - firecrawl-local-darwin-amd64 (macOS 13+, Intel)
          - firecrawl-local-linux-arm64 (glibc 2.35+, arm64)
          - firecrawl-local-linux-amd64 (glibc 2.35+, x86-64)
          - firecrawl-local-$VERSION.crate (exact corresponding source)
          - LICENSE, NOTICE.md, SOURCE.md
          - SHA256SUMS

          There are no Windows or musl builds.

          ## Verify

          Download SHA256SUMS beside a binary, then:

              gh attestation verify firecrawl-local-linux-amd64 --repo $GITHUB_REPOSITORY
              sha256sum -c SHA256SUMS

          On macOS use shasum -a 256 -c SHA256SUMS.

          The attestation covers every file listed in SHA256SUMS. Provenance was recorded for workflow run:
          $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          ## Source and licence

          The binaries are built from the attached crate archive without modifying its source. Firecrawl Local is
          Copyright Firecrawl (Mendable AI, Inc.) and licensed under the GNU Affero General Public License, version 3.
          The full licence is attached as LICENSE. Upstream source:
          https://github.com/firecrawl/firecrawl/tree/$CRATE_VCS_COMMIT/apps/local

          The build recipe is at $GITHUB_SERVER_URL/$GITHUB_REPOSITORY.
          EOF
          echo "notes=$notes" >> "$GITHUB_ENV"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          if gh release view "$TAG" --repo "$repo" >/dev/null 2>&1; then
            draft=$(gh release view "$TAG" --repo "$repo" --json isDraft --jq '.isDraft')
            if [ "$draft" != "true" ]; then
              echo "release $TAG is already published; refusing to replace its assets" >&2
              exit 1
            fi
            gh release edit "$TAG" --repo "$repo" --draft \
              --title "firecrawl-local $VERSION" --notes-file "$notes"
          else
            gh release create "$TAG" --repo "$repo" --draft --verify-tag \
              --title "firecrawl-local $VERSION" --notes-file "$notes"
          fi
          gh release upload "$TAG" "$RUNNER_TEMP"/dist/* --repo "$repo" --clobber
          expected=$(printf '%s\n' \
            firecrawl-local-darwin-amd64 \
            firecrawl-local-darwin-arm64 \
            firecrawl-local-linux-amd64 \
            firecrawl-local-linux-arm64 \
            "firecrawl-local-$VERSION.crate" \
            LICENSE NOTICE.md SHA256SUMS SOURCE.md | LC_ALL=C sort)
          actual=$(gh release view "$TAG" --repo "$repo" --json assets --jq '.assets[].name' \
            | LC_ALL=C sort)
          if [ "$actual" != "$expected" ]; then
            printf 'unexpected release assets\nexpected:\n%s\nactual:\n%s\n' "$expected" "$actual" >&2
            exit 1
          fi
          gh release edit "$TAG" --repo "$repo" --draft=false
      - name: Verify the published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          is_draft=$(gh release view "$TAG" --repo "$repo" --json isDraft --jq '.isDraft')
          test "$is_draft" = "false"
          mkdir -p "$RUNNER_TEMP/verify"
          gh release download "$TAG" --repo "$repo" --dir "$RUNNER_TEMP/verify"
          (cd "$RUNNER_TEMP/verify" && sha256sum -c SHA256SUMS)
          chmod +x "$RUNNER_TEMP/verify/firecrawl-local-linux-amd64"
          "$RUNNER_TEMP/verify/firecrawl-local-linux-amd64" --version | grep -F "$VERSION"
          for name in \
            firecrawl-local-darwin-arm64 \
            firecrawl-local-darwin-amd64 \
            firecrawl-local-linux-arm64 \
            firecrawl-local-linux-amd64 \
            "firecrawl-local-$VERSION.crate" \
            LICENSE NOTICE.md SOURCE.md SHA256SUMS; do
            test -s "$RUNNER_TEMP/verify/$name" || {
              echo "published release is missing $name" >&2
              exit 1
            }
          done
          {
            echo "## firecrawl-local $VERSION published"
            echo
            echo "Release: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"
            echo
            for name in firecrawl-local-darwin-arm64 firecrawl-local-darwin-amd64 \
              firecrawl-local-linux-arm64 firecrawl-local-linux-amd64 SHA256SUMS; do
              echo "- $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG/$name"
            done
          } >> "$GITHUB_STEP_SUMMARY"
